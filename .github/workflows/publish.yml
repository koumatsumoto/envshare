name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'koumatsumoto/envshare' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require the reviewed main commit
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$REVIEWED_SHA" ]; then
            echo 'main changed since this release was reviewed.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Prepare and test the exact release archive
        run: npm run test:package -- "$RUNNER_TEMP/envshare-release.tgz"

      - name: Check that the unscoped package name is not already registered
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'envshare' || version !== '0.1.0') {
            throw new Error('This workflow is only for the initial envshare@0.1.0 release');
          }
          const response = await fetch('https://registry.npmjs.org/envshare', {
            redirect: 'error', signal: AbortSignal.timeout(15_000),
          });
          if (response.status === 200) throw new Error('The unscoped npm name envshare already exists');
          if (response.status !== 404) throw new Error(`Cannot verify envshare: HTTP ${response.status}`);
          NODE

      - name: Publish the verified tarball
        id: upload
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Set NPM_TOKEN in the repository Actions secrets.' >&2
            exit 1
          fi
          npm publish "$RUNNER_TEMP/envshare-release.tgz" --registry https://registry.npmjs.org/ --access public --ignore-scripts --fetch-retries=0 --fetch-timeout=60000

      - name: Verify public registry metadata for this tarball
        if: ${{ !cancelled() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          let response;
          for (let attempt = 1; attempt <= 4; attempt++) {
            response = await fetch('https://registry.npmjs.org/envshare/0.1.0', {
              redirect: 'error', signal: AbortSignal.timeout(15_000),
            });
            if (response.status === 200) break;
            if (response.status !== 404 || attempt === 4) {
              throw new Error(`Release is not verified: HTTP ${response.status}`);
            }
            await new Promise(resolve => setTimeout(resolve, 3_000));
          }
          const { name, version, dist } = await response.json();
          const digest = createHash('sha512')
            .update(readFileSync(join(process.env.RUNNER_TEMP, 'envshare-release.tgz'))).digest('base64');
          if (name !== 'envshare' || version !== '0.1.0' || dist?.integrity !== `sha512-${digest}`) {
            throw new Error('Registry version or integrity differs from the tested tarball');
          }
          console.log('Verified envshare@0.1.0 on the public npm registry');
          NODE

      - name: Install the published package in a clean directory
        run: |
          consumer=$(mktemp -d "$RUNNER_TEMP/envshare-npm-check.XXXXXX")
          npm install --prefix "$consumer" --cache "$consumer/cache" --registry https://registry.npmjs.org/ --no-save --ignore-scripts --no-audit --no-fund envshare@0.1.0
          "$consumer/node_modules/.bin/envshare" --help | grep -F 'envshare encrypt'
